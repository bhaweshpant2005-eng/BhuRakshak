services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhurakshak}
      POSTGRES_USER: ${POSTGRES_USER:-bhurakshak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhurakshak-local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    profiles: ["object-storage"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-bhurakshak}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-bhurakshak-local-only}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

volumes:
  postgis_data:
  minio_data:
